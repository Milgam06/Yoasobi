mutation CreateUser($input: CreateUserInputDto!) {
  createUser(input: $input) {
    user {
      id
      name
      timezone
      createdAt
      updatedAt
    }
  }
}

query getExistingUser($input: GetUserInputDto!) {
  getUser(input: $input) {
    user {
      id
      name
      timezone
      createdAt
      updatedAt
    }
  }
}
